<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Empresas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 8px 12px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; color: white;}
        .btn-new { background-color: #28a745; display: inline-block; font-weight: bold;}
        .btn-edit { background-color: #ffc107; color: black; font-weight: bold;}
        .btn-delete { background-color: #dc3545; font-weight: bold;}
        .alert { padding: 10px; margin-bottom: 20px; font-weight: bold;}
        .alert-success { background-color: #d4edda; color: #155724; }
        .alert-danger { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2>Empresas Cadastradas</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <a th:href="@{/empresa/formulario}" class="btn btn-new">+ Nova Empresa</a>
        
        <form th:action="@{/empresa}" method="get">
            <input type="text" name="keyword" th:value="${keyword}" placeholder="Buscar por Razão Social..." style="padding: 8px; width: 250px;"/>
            <button type="submit" style="padding: 8px 15px; background-color: #007bff; color: white; border: none;">Buscar</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Razão Social</th>
                <th>Cidade</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Nome do Contato</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <!-- Este loop 'each' constrói uma linha na tabela para cada empresa do banco -->
            <tr th:each="emp : ${lista}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.razaoSocial}"></td>
                <td th:text="${emp.cidade}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.telefone}"></td>
                <td th:text="${emp.nomeContato}"></td>
                <td>
                    <a th:href="@{/empresa/formulario/{id}(id=${emp.id})}" class="btn btn-edit">Editar</a>
                    
                    <!-- Excluir precisa de um form (POST) por segurança -->
                    <form th:action="@{/empresa/delete/{id}(id=${emp.id})}" method="post" style="display:inline;" onsubmit="return confirm('Tem certeza que deseja apagar esta empresa permanentemente?');">
                        <button type="submit" class="btn btn-delete">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(lista)}">
                <td colspan="7" style="text-align: center; color: #666; font-style: italic;">Nenhuma empresa cadastrada ou encontrada.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
