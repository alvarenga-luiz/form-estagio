<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Manter Empresa')}"></head>
<body>
	<header th:replace="~{fragmentos/header :: header(activePage='empresa')}"></header>

	<div class="container-fluid" style="max-width: 1000px; margin: 0 auto;">
		<h2 class="text-center mt-3"
			th:text="${edicao} ? 'Editar Empresa' : 'Cadastrar Nova Empresa'"></h2>

		<div th:if="${message != null}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
			[[${message}]]
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
		<div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
			[[${error}]]
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>

		<!-- BUSCAR (protótipo) -->
		<form th:action="@{/empresa/formulario}" method="get" class="row g-2 mb-4">
			<div class="col-md-8">
				<input type="search" name="termo" th:value="${termo}" class="form-control" placeholder="Buscar por razão social">
			</div>
			<div class="col-md-4">
				<button type="submit" class="btn btn-secondary">buscar</button>
				<a th:href="@{/empresa/formulario}" class="btn btn-info">limpar</a>
			</div>
		</form>

		<div th:if="${resultados != null}" class="mb-4">
			<p class="mb-1">Foram encontradas várias empresas, escolha uma:</p>
			<ul class="list-group">
				<li class="list-group-item" th:each="r : ${resultados}">
					<a th:href="@{'/empresa/formulario/' + ${r.id()}}">[[${r.razaoSocial()}]] - [[${r.cidade()}]]</a>
				</li>
			</ul>
		</div>

		<!-- FORMULÁRIO -->
		<form th:object="${empresa}" th:action="${edicao} ? @{/empresa/atualizar} : @{/empresa/salvar}"
			method="post" enctype="application/x-www-form-urlencoded">
			<input th:if="${edicao}" type="hidden" th:field="*{id}" />

			<div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:errors="*{global}"></div>

			<div class="row g-3 mb-3">
				<div class="col-md-8">
					<label for="razaoSocial" class="form-label">Razão Social</label>
					<input type="text" class="form-control" id="razaoSocial" th:field="*{razaoSocial}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{razaoSocial}"></div>
				</div>
				<div class="col-md-4">
					<label for="areaAtuacao" class="form-label">Área de Atuação</label>
					<input type="text" class="form-control" id="areaAtuacao" th:field="*{areaAtuacao}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{areaAtuacao}"></div>
				</div>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-6">
					<label for="endereco" class="form-label">Endereço</label>
					<input type="text" class="form-control" id="endereco" th:field="*{endereco}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{endereco}"></div>
				</div>
				<div class="col-md-4">
					<label for="cidade" class="form-label">Cidade</label>
					<input type="text" class="form-control" id="cidade" th:field="*{cidade}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{cidade}"></div>
				</div>
				<div class="col-md-2">
					<label for="cep" class="form-label">CEP</label>
					<input type="text" class="form-control" id="cep" th:field="*{cep}" placeholder="00000-000" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{cep}"></div>
				</div>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-4">
					<label for="email" class="form-label">E-mail</label>
					<input type="email" class="form-control" id="email" th:field="*{email}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{email}"></div>
				</div>
				<div class="col-md-4">
					<label for="telefone" class="form-label">Telefone</label>
					<input type="text" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(11) 91234-5678" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{telefone}"></div>
				</div>
				<div class="col-md-4">
					<label for="site" class="form-label">Site</label>
					<input type="text" class="form-control" id="site" th:field="*{site}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{site}"></div>
				</div>
			</div>

			<div class="row g-3 mb-3">
				<div class="col-md-4">
					<label for="nomeContato" class="form-label">Nome do Contato</label>
					<input type="text" class="form-control" id="nomeContato" th:field="*{nomeContato}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{nomeContato}"></div>
				</div>
				<div class="col-md-4">
					<label for="cargoContato" class="form-label">Cargo do Contato</label>
					<input type="text" class="form-control" id="cargoContato" th:field="*{cargoContato}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{cargoContato}"></div>
				</div>
				<div class="col-md-4">
					<label for="areaDepartamento" class="form-label">Área / Departamento</label>
					<input type="text" class="form-control" id="areaDepartamento" th:field="*{areaDepartamento}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{areaDepartamento}"></div>
				</div>
			</div>

			<div class="row g-3 mb-4">
				<div class="col-md-12">
					<label for="linkedin" class="form-label">LinkedIn</label>
					<input type="text" class="form-control" id="linkedin" th:field="*{linkedin}" th:errorclass="is-invalid">
					<div class="invalid-feedback" th:errors="*{linkedin}"></div>
				</div>
			</div>

			<div class="text-center">
				<button type="submit" class="btn btn-primary me-2" th:text="${edicao} ? 'atualizar' : 'salvar'"></button>
				<button type="submit" th:if="${edicao}"
					th:formaction="@{/empresa/delete/{id}(id=*{id})}"
					onclick="return confirm('Deseja realmente excluir esta empresa?')"
					class="btn btn-danger me-2">deletar</button>
				<a th:href="@{/empresa}" class="btn btn-secondary">Cancelar</a>
			</div>
		</form>
	</div>

	<div th:replace="~{fragmentos/footer :: footer}"></div>
</body>
</html>
